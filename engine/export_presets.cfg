; macOS 데모 실행 파일 내보내기 설정. 쓰는 법은 engine/README.md 의 '데모 실행 파일 만들기' 에 있습니다.
; 여기 없는 항목은 Godot 가 기본값을 씁니다 (코드 서명: 맥에서 내보내면 Godot 내장 임시 서명). 편집기의 내보내기 창에서
; 저장하면 Godot 가 이 주석을 지우고 모든 항목을 기본값과 함께 다시 씁니다.

[preset.0]

name="macOS"
platform="macOS"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="samples/*.bin"
exclude_filter="baked/*, export/*, Tests/*"
export_path="export/B-PCG.app"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

binary_format/architecture="arm64"
application/bundle_identifier="io.github.cau-8.b-pcg"
application/short_version="0.1.0"
application/version="0.1.0"
display/high_res=true
