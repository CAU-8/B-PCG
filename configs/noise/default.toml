# 노이즈 비교본 설정: 오늘날 게임처럼 노이즈(무작위 값을 매끈하게 겹친 무늬)만으로 행성 전체를 만들 때 쓰는 값입니다 (docs/noise_world.md).
# 행성 반지름, 칸 크기, 히어로·회랑 크기, 시드는 B-PCG 와 같은 configs/planets·profiles 값을 씁니다. 여기 값은 노이즈 모양만 정합니다.
# 길이 단위는 m 입니다. 파장(wavelength)은 무늬 하나가 되풀이되는 길이이고, 키우면 무늬가 커집니다.

[sea]
ocean_fraction = 0.71                 # 바다가 덮는 넓이의 몫 (0.71 = 열 칸 가운데 일곱 칸, 지구 값). 행성 지도 칸에서 이 몫이 되도록 대륙 노이즈의 해안 자리를 옮김

[continents]
wavelength_m = 6_000_000.0            # 대륙 무늬의 파장. 키우면 대륙이 크고 적어짐
octaves = 6                           # 겹치는 물결 수. 키우면 해안선이 더 잘게 구불거림
warp_wavelength_m = 3_000_000.0       # 대륙 무늬를 비트는 노이즈의 파장
warp_m = 1_000_000.0                  # 비트는 거리. 키우면 대륙 모양이 더 휘어짐 (0 이면 비틀지 않음)

[mountains]
wavelength_m = 40_000.0               # 산줄기 무늬(날카로운 마루를 만드는 ridged 노이즈)의 가장 긴 파장. 줄이면 산줄기 사이가 좁아짐
height_m = 2_800.0                    # 산줄기가 기본 땅 위로 솟는 가장 큰 높이. 키우면 산이 높아짐
erosion_wavelength_m = 2_000_000.0    # 산지와 평지를 나누는 노이즈의 파장. 키우면 산지·평지 덩어리가 커짐
gain = 0.55                           # 물결이 반으로 짧아질 때 세기가 몇 배가 되는지 (0.5 = 반). 키우면 산이 거칠어짐

[hills]
wavelength_m = 6_000.0                # 언덕 무늬의 가장 긴 파장
height_m = 300.0                      # 언덕의 높이 폭. 키우면 평지도 울퉁불퉁해짐
gain = 0.55                           # 물결이 반으로 짧아질 때 세기가 몇 배가 되는지. 키우면 언덕이 거칠어짐
rough_wavelength_m = 160.0            # 가까이서 보이는 잔 거칠기의 가장 긴 파장
rough_height_m = 5.0                  # 잔 거칠기의 높이 폭 (가파른 곳에서 다 더하고 평평한 곳에서 줄임)

[rivers]
wavelength_m = 120_000.0              # 강 노이즈의 파장. 이 노이즈 값이 0 에 가까운 띠를 강 골짜기로 팜. 키우면 강이 드물고 길게 휘어짐
valley_half_width_m = 600.0           # 강 골짜기 반폭. 키우면 골짜기가 넓어짐
valley_depth_m = 150.0                # 골짜기를 둘레 땅보다 낮추는 가장 큰 깊이 (해수면 1 m 위까지만). 골짜기 바닥은 둘레 땅을 따라 오르내림
channel_half_width_m = 8.0            # 물이 흐르는 물길의 반폭
channel_depth_m = 2.5                 # 물길 바닥이 골짜기 바닥보다 낮은 깊이. 수면은 물길 깊이의 4분의 3 높이에 둠

[aquifer]
depth_min_m = 6.0                     # 지표에서 지하수면까지 가장 얕은 깊이. 지하수면은 지표를 따라 이 깊이 아래에 놓여 땅 위로 올라오지 않음 (그래서 호수가 생기지 않음)
depth_range_m = 30.0                  # 지하수면 깊이가 노이즈로 흔들리는 폭 (깊이 = 가장 얕은 깊이 + 0~이 값)
depth_wavelength_m = 6_000.0          # 지하수면 깊이 노이즈의 파장

[caves]
region_wavelength_m = 900.0           # 동굴이 있는 구역을 나누는 노이즈의 파장. 이 노이즈가 0 보다 큰 곳에만 동굴이 있음
region_threshold = 0.05               # 동굴 구역 문턱. 키우면 동굴 구역이 줄어듦
tunnel_wavelength_m = 170.0           # 굴 노이즈의 파장. 서로 다른 노이즈 둘이 모두 0 에 가까운 줄을 굴로 팜. 키우면 굴이 드물고 곧아짐
tunnel_radius_m = 2.6                 # 굴 반지름의 가운데 값
tunnel_radius_range_m = 1.4           # 굴 반지름이 노이즈로 흔들리는 폭 (반지름 = 가운데 값 ± 이 값의 반)
chamber_wavelength_m = 110.0          # 큰 방 노이즈의 파장
chamber_threshold = 0.42              # 큰 방 문턱. 노이즈가 이 값보다 큰 곳이 방. 키우면 방이 작고 드물어짐
chamber_min_depth_m = 25.0            # 큰 방이 생기는 가장 얕은 깊이 (지표 아래)
vertical_squash = 1.0                 # 굴·방 노이즈를 위아래로 누르는 배수. 1 이면 굴이 방향을 가리지 않고, 키우면 수평에 가깝게 눕고 납작해짐 (굴 높이 = 폭 ÷ 이 값). 키우면 지표를 얕게 스치는 구멍도 늘어남
max_depth_m = 280.0                   # 동굴이 생기는 가장 깊은 곳 (지표 아래). 재질 부피 깊이(약 300 m)보다 얕게 둠

[strata]
province_wavelength_m = 30_000.0      # 암석 구역(퇴적암·변성암·화성암 가운데 하나로 채운 땅 덩어리)의 크기
band_thickness_m = 24.0               # 암석 띠 하나의 두께. 띠마다 구역의 암석 목록에서 하나를 고름
warp_m = 90.0                         # 띠를 위아래로 휘게 하는 노이즈 세기
warp_wavelength_m = 2_500.0           # 띠를 휘게 하는 노이즈의 파장
max_dip_deg = 10.0                    # 구역마다 띠가 기우는 가장 큰 각도
soil_max_m = 1.6                      # 평평한 땅을 덮는 흙의 가장 두꺼운 두께. 경사가 급할수록 얇아지고 가파른 곳에선 0
alluvium_m = 3.0                      # 강 골짜기 바닥과 바닷가를 덮는 모래·자갈 두께

[climate]
temperature_noise_c = 3.0             # 기온에 더하는 노이즈의 폭. 위도와 높이로 정한 기온에 ±이 값만큼 더함
temperature_wavelength_m = 1_500_000.0 # 기온 노이즈의 파장
precip_max_m_per_yr = 2.6             # 가장 많이 오는 연강수량. 강수는 위도와 상관없는 노이즈로만 정함
precip_wavelength_m = 2_000_000.0     # 강수 노이즈의 파장
