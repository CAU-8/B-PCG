# 기존 지형 생성 방법론과 B-PCG 비교 (docs/compare.md).
# 방법 목록은 Galin 외 2019 "A Review of Digital Terrain Modeling" 그림 34 의 대표 방법을 따릅니다.
#
# 실행:  uv run bpcg compare run --config configs/compare/default.toml
# 보기:  uv run bpcg compare list --set default   또는 스튜디오의 '방법 비교' 화면
#
# [[methods]] 하나가 비교 대상 하나입니다. id 는 결과 폴더 이름, method 는 등록된 방법 이름
# (uv run bpcg compare methods 로 목록과 매개변수를 봄), params 는 기본값에서 바꿀 것만 적습니다.
# 같은 method 를 params 만 바꿔 id 를 달리하면 변형을 하나 더 비교합니다(아래 ridged_sharp 처럼).
# 새 방법은 src/Bpcg/Compare/ 에 C# 파일 하나를 더하고 MethodRegistry.Builtins() 에 한 줄을 넣습니다.

[grid]
n = 256              # 한 변 칸 수
dx = 50.0            # 칸 간격 [m] → 한 변 12.8 km
relief_m = 1500.0    # 절차적 방법(높이 단위 없음)을 맞출 기복 [m]

[run]
seeds = [0, 1, 2]
snapshots = true     # 연산 과정(중간 지도·곡선)을 남김. false 면 고도·지표만

# ---- 절차적 생성 (Galin 2019 3장)
[[methods]]
id = "fbm"

[[methods]]
id = "ridged"

[[methods]]
id = "ridged_sharp"
method = "ridged"
params = { h = 0.8, ridge_gain = 3.0 }

[[methods]]
id = "multifractal"

[[methods]]
id = "warped"

[[methods]]
id = "diamond_square"

[[methods]]
id = "faulting"

# ---- 시뮬레이션 (4장). thermal·hydraulic 의 시작 지형은 같은 시드의 fbm 과 같습니다.
[[methods]]
id = "thermal"

[[methods]]
id = "hydraulic"

[[methods]]
id = "stream_power"

# ---- 예제 기반 (5장)
[[methods]]
id = "quilting"

# ---- 우리 방법
[[methods]]
id = "bpcg"
