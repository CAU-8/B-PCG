# 기존 지형 생성 방법과 B-PCG 를 같은 땅 크기·같은 시드로 돌려 견주는 설정입니다 (docs/compare.md).
# 방법 목록은 Galin 외 2019 "A Review of Digital Terrain Modeling" 그림 34 의 대표 방법을 따릅니다.
#
# 실행:  uv run bpcg compare run --config configs/compare/default.toml
# 보기:  uv run bpcg compare list --set default   또는 스튜디오의 '방법 비교' 화면
#
# [[methods]] 하나가 비교 대상 하나입니다. id 는 결과 폴더 이름이고, method 는 등록된 방법 이름입니다(없으면 id 와 같음).
# 등록된 방법과 매개변수 목록은 uv run bpcg compare methods 로 봅니다. params 에는 기본값에서 바꿀 것만 적습니다.
# 같은 method 를 params 만 바꿔 id 를 달리하면 변형을 하나 더 비교합니다(아래 ridged_sharp 처럼).
# 새 방법은 src/Bpcg/Compare/ 에 C# 파일 하나를 더하고 MethodRegistry.Builtins() 에 한 줄을 넣습니다.

[grid]
n = 256              # 한 변 칸 수 (16~2049). 늘리면 칸 수가 제곱으로 늘어 오래 걸림
dx = 50.0            # 칸 간격 [m] → 한 변 12.8 km
relief_m = 1500.0    # 절차적 방법은 높이 단위가 없어서, 가장 낮은 곳 0 부터 가장 높은 곳 이 값 [m] 까지로 맞춤

[run]
seeds = [0, 1, 2]    # 돌릴 시드 목록. 시드마다 모든 방법을 한 번씩 돌려 같은 시드끼리 견줌
snapshots = true     # 연산 과정(방법이 지형을 만드는 동안의 중간 지도·곡선)을 남김. false 면 마지막 고도와 지표만

# ---- 절차적 생성 (Galin 2019 3장): 무작위 수와 수식만으로 높이를 만듦
[[methods]]
id = "fbm"

[[methods]]
id = "ridged"

[[methods]]
id = "ridged_sharp"
method = "ridged"
params = { h = 0.8, ridge_gain = 3.0 }   # 기본(h 1.0, ridge_gain 2.0)보다 잔물결을 덜 줄이고, 높은 곳의 다음 겹을 더 키워 산마루를 날카롭게

[[methods]]
id = "multifractal"

[[methods]]
id = "warped"

[[methods]]
id = "diamond_square"

[[methods]]
id = "faulting"

# ---- 시뮬레이션 (4장): 물과 흙이 움직이는 규칙을 시간 순서로 돌려 깎음. thermal·hydraulic 의 시작 지형은 같은 시드의 fbm 과 같습니다.
[[methods]]
id = "thermal"

[[methods]]
id = "hydraulic"

[[methods]]
id = "stream_power"

# ---- 예제 기반 (5장): 진짜 지형 조각을 이어 붙임
[[methods]]
id = "quilting"

# ---- 우리 방법: 평면 히어로를 이 비교 격자 크기로 돌림 (docs/pipeline.md 9장)
[[methods]]
id = "bpcg"
