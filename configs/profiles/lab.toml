# 연구실 PC 프로필: 보고용 고해상도 실행만 (데모에는 쓰지 않음).

[grid]
coarse_n_per_face = 256
l0_n_per_face = 1024           # 약 9.8 km, 629만 칸 (보고용)

[hero]
max_flow_iterations = 1000      # 히어로는 칸이 많아 반복이 더 필요 (1280² 에서 약 450~600회)
spacing_m = 25.0
size_m = 40_000.0

[corridor]
voxel_m = 1.0
width_m = 1_000.0
length_m = 8_000.0

[compute]
numba_threads = 0 # 기존 이름 유지: 0 = Auto, 1 = Single Thread, 그 외 = Manual 최대 수
