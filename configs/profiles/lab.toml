# 연구실 PC 프로필: 보고용 고해상도 실행에만 씁니다 (데모에는 쓰지 않음).

[grid]
coarse_n_per_face = 256        # 칸 약 39 km
l0_n_per_face = 1024           # 행성 지도(L0) 칸 약 9.8 km, 629만 칸 (보고용)

[hero]
max_flow_iterations = 1000      # 히어로는 칸이 많아 반복이 더 필요 (1280² 칸에서 약 450~600회)
spacing_m = 25.0
size_m = 40_000.0              # 한 변 40 km, 1600 × 1600칸

[corridor]
voxel_m = 1.0
width_m = 1_000.0
length_m = 8_000.0

[compute]
numba_threads = 0 # 옛 파이썬(Numba) 판의 이름을 그대로 씀. 1 = 한 스레드, 2 이상 = 쓸 스레드 수의 상한 (코어 수까지)
