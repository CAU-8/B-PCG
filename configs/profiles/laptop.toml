# 노트북(메모리 16 GB) 프로필: 데모와 평소 실험에 씁니다. 꼭 할 일은 모두 이 프로필로 돌아가야 합니다 (11/11 데모 기기 점검).

[grid]
coarse_n_per_face = 128        # 칸 약 78 km (제주도 동서 길이보다 조금 김). 판·기후를 여기서 만듦
l0_n_per_face = 512            # 행성 지도(L0) 칸 약 19.5 km, 157만 칸

[hero]
max_flow_iterations = 800      # 히어로는 칸이 많아 반복이 더 필요 (1280² 칸에서 약 450~600회)
spacing_m = 25.0               # 25 m 는 수영장 레인 하나
size_m = 32_000.0              # 한 변 32 km (30~40 km), 1280 × 1280칸. 서울만 한 네모

[corridor]
voxel_m = 2.0                  # 2 m 는 사람 키 정도 (1.0 은 연구실 PC)
width_m = 1_000.0
length_m = 6_000.0

[compute]
numba_threads = 0              # 옛 파이썬(Numba) 판의 이름을 그대로 씀. 1 = 한 스레드, 2 이상 = 쓸 스레드 수의 상한 (코어 수까지)
