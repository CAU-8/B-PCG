# 지구 크기 행성 하나의 기본값입니다 (설계도 1~5장, docs/pipeline.md). 단위는 m, kg, s, yr(년), °C 이고, 키 이름이 _myr 로 끝나는 값만 Myr(100만 년)입니다.
# 중력은 여기 적지 않고 반지름과 밀도로 계산합니다 (g = 4/3·π·G·ρ·R ≈ 9.82 m/s²).
# 모든 값은 논문·관측에서 고른 기본값입니다. 실제 지형 자료로 숫자를 맞추는 일(설계도 6장)은 아직 하지 않았습니다.
# 맞춘 값이 생기면 configs/learned/ 의 값이 같은 키를 덮어씁니다.

[planet]
name = "earth"
radius_m = 6_371_000.0
mean_density_kg_m3 = 5514.0
rotation_period_s = 86_164.1          # 별을 기준으로 한 바퀴 도는 시간(항성일, 약 23시간 56분). 지금 생성기는 이 값을 읽지 않음
axis = [0.0, 0.0, 1.0]                # 자전축 방향 (단위 벡터). 위도를 재는 기준이라 비와 기온의 띠가 이 축을 따라 놓임
seed = 0                              # 출발 번호. 같은 시드면 어느 컴퓨터에서든 같은 행성이 나옴. 히어로 유역과 함께 6주차에 고정합니다

# ---------------------------------------------------------------- 뼈대 사슬 (사슬 1): 판 → 지각 → 해양저·융기
[plates]
count = 12                            # 판 개수. 키우면 판 하나하나가 작아지고 판 경계가 늘어남
continental_area_fraction = 0.40      # 대륙 지각이 덮는 넓이의 목표 비율 (0.40 = 열 칸 가운데 네 칸; 지구 약 40%, 원문 확인 필요)
warp_amplitude = 0.12                 # 판 경계를 구불구불하게 하는 노이즈 세기 (반지름 1 인 구 위의 길이). 키우면 경계가 더 크게 구불거림
warp_frequency = 2.5                  # 그 노이즈의 기본 주파수 (반지름 1 인 구 기준). 키우면 경계가 더 잘게 구불거림
speed_m_per_yr = [0.02, 0.08]         # 판이 움직이는 속도의 범위 2~8 cm/yr. 판마다 이 안에서 고름. 빨리 마주 올수록 산맥이 빨리 솟음
boundary_kappa = 0.3                  # 판 경계를 가르는 비율 κ (가이드 5장). 마주 오는(멀어지는) 속도가 미끄러지는 속도의 κ배를 넘으면 수렴(발산), 아니면 변환. 키우면 변환 경계가 늘어남

[crust]
continental_thickness_m = 35_000.0
oceanic_thickness_m = 7_000.0
collision_thickening_m = 25_000.0     # 대륙끼리 부딪힌 곳(충돌대)에서 지각에 더하는 두께의 최댓값. 두꺼운 지각은 물에 뜬 두꺼운 얼음처럼 더 높이 뜸(지각평형)
thickening_width_m = 300_000.0        # 그 두께가 퍼지는 폭 (가우스 폭: 충돌 경계에서 이 거리면 더하는 두께가 약 37%)
margin_width_m = 150_000.0            # 대륙 가장자리에서 지각이 얇아지며 바다 밑으로 내려가는 띠(대륙붕·대륙사면)의 폭. 키우면 더 완만하게 내려감
continental_platform_m = 250.0        # 두께 35 km 인 보통 대륙 지각이 뜨는 높이 (해수면 기준 근사). 바다와 육지를 가르는 기준 고도에 쓰고, 산 높이는 솔버가 따로 정함
rho_crust = 2_800.0
rho_mantle = 3_300.0
rho_water = 1_030.0

[ocean]
water_volume_m3 = 1.335e18            # 바다에 채우는 물의 부피 (지구 바다 물 부피). 낮은 곳부터 이만큼 채운 높이가 해수면. 키우면 바다가 넓어짐
ridge_depth_m = 2_500.0               # 바다 밑 산맥(해령) 꼭대기의 깊이 (Parsons & Sclater 1977). 해양저는 여기서 생겨 나이가 들수록 식어 깊어짐
age_cap_myr = 200.0                   # 해양저 나이의 상한 (안전장치). 나이는 해령에서 흐름선을 따라 떨어진 거리로 정해져 저절로 잘리게 함 (설계도 5장 17번)
trench_depth_m = 3_000.0              # 해구(바다 판이 파고드는 곳의 깊은 골)에서 바다 밑이 더 깊어지는 양 (띠가 좁아 L0 에서 다시 계산)
trench_width_m = 40_000.0

[uplift]
orogen_factor = 0.03                  # 바다 판이 파고드는 곳(섭입)의 위쪽 판에서 산맥이 솟는 속도 = 계수 × 마주 오는 속도 (5 cm/yr → 1.5 mm/yr). 키우면 산맥이 높아짐
collision_factor = 0.04               # 대륙끼리 부딪힌 곳(충돌대)이 솟는 속도 = 계수 × 마주 오는 속도. 키우면 충돌대가 높아짐
orogen_width_m = 80_000.0             # 섭입 산맥이 솟는 띠의 폭 (가우스 폭, 띠 가운데는 화산호 자리). 150 km 는 띠가 너무 넓어 L0 가 10 km 를 넘음
collision_width_m = 100_000.0         # 충돌대가 솟는 띠의 폭 (가우스 폭: 판 경계에서 이 거리면 융기가 약 37%)
slab_shallow_dip_deg = 15.0           # 파고드는 판(섭입판)의 얕은 구간 기울기 (설계도 5장 16번: 10~20°). 키우면 화산호와 산맥 띠가 해구 쪽으로 다가옴
slab_shallow_depth_m = 40_000.0       # 얕은 구간이 끝나는 깊이 (30~50 km)
slab_deep_dip_deg = 50.0              # 깊은 구간 기울기
arc_slab_depth_m = 100_000.0          # 화산호 아래 섭입판의 깊이. 위 넷이 해구–화산호 거리를 정함 (기본값으로 약 200 km)
craton_erosion_m_per_myr = 5.0        # 산맥 밖 오래된 대륙(크라톤)의 기본 깎임 (2~10 m/Myr). 모든 육지 칸에 이만큼의 융기를 깔아 둠 (5 m/Myr = 100만 년에 5 m)
rift_subsidence_m_per_yr = -1.0e-4    # 대륙이 갈라지는 곳(열곡) 축이 가라앉는 속도 (음수, −0.1 mm/yr). 축에서 50 km 안의 대륙에만
orogen_duration_myr = 30.0            # 산맥이 솟아 온 기간. 깎인 두께 = 융기 × 기간. 키우면 더 깊은 지층이 지표에 드러남
exhumation_cap_m = 30_000.0           # 깎인 두께(누적 융기)의 상한 (25~35 km, 설계도 5장 8번)
elevation_limit_m = 5_500.0           # 지각 세기 한계: 첫 풀이의 평균 지표가 이 높이(백두산의 약 2배)에 가까운 곳은 융기를 줄여 다시 풂 (pipeline.md 7.1 추가). 키우면 더 높은 고원이 남음
elevation_limit_power = 4.0           # 줄이는 모양 p: U' = U·(1 − (z_mean/z_lim)^p). 키우면 한계 가까이에서만 줄임 (p = 4 면 한계의 절반 높이에서 6%만 줄임)

# ---------------------------------------------------------------- 가벼운 기후: 위도와 높이로 정하는 비·기온·유출
[climate]
p_base_m_per_yr = 0.25                # 어디에나 내리는 기본 강수 p₀. 위도 띠 강수 (가이드 5장): P = (p₀ + p₁·e^… + p₂·e^…)·e^(η ξ − η²/2)
p_equator = 1.8
p_equator_sigma_deg = 12.0
p_midlat = 0.9
p_midlat_center_deg = 50.0
p_midlat_sigma_deg = 12.0
p_noise = 0.35                        # 강수를 곳마다 들쭉날쭉하게 하는 노이즈 세기 η_P. 0 이면 위도로만 정해지고, 키우면 비가 많은 곳과 적은 곳의 차이가 커짐
t_equator_c = 27.0
t_pole_c = -25.0
lapse_rate_c_per_m = 0.0065
pet_per_degc_m_per_yr = 0.055         # 기온 1 °C 마다 늘어나는 잠재 증발산(물이 넉넉할 때 증발할 수 있는 양) a. 잠재 증발산 = a·max(T, 0) + b. 키우면 강으로 가는 물(유출)이 줄어듦
pet_base_m_per_yr = 0.1
runoff_floor_fraction = 0.1           # 침식에 쓰는 유출의 바닥값: 강수의 이 비율 (설계도 5장 1번). 사막에서도 강이 조금은 깎게 함
runoff_floor_m_per_yr = 0.01
runoff_ref_m_per_yr = 0.3             # 기준 유출. G-법칙의 기준으로, 강물 대비 흙의 비율 Qs/Q 를 깎는 속도로 바꿈 (깎임 = U + G·이 값·Qs/Q). 키우면 G 를 키운 것과 같음

# ---------------------------------------------------------------- 조각 사슬 (사슬 2): 강과 비탈이 깎는 산의 모양 (솔버)
[landscape]
theta = 0.45                          # 강이 상류에서 가파르고 바다 쪽으로 갈수록 완만해지는 정도(오목도 θ). 물이 10배 늘면 경사가 약 0.35배 (생성기에서는 고정)
slope_exponent_n = 2.0                # 깎는 속도 ∝ 강 가파름^n. n > 1 이 흔함 (설계도 5장 6번). n = 2 면 융기가 4배일 때 강 가파름은 2배. n = 1 은 L0 가 수십 km
k_ref = 150.0                         # 기준 암석이 U_ref 로 솟을 때의 강 가파름 k_s (Q 단위 m³/yr). 강 경사 = k_s·Q^(−θ). 키우면 강과 산이 같은 비율로 가팔라짐
u_ref_m_per_yr = 1.0e-3               # k_ref 를 정하는 기준 융기 속도 U_ref, 1 mm/yr (1,000년에 1 m)
hillslope_diffusivity_m2_per_yr = 0.005
deposition_g = 1.0                    # 강이 나르는 흙이 많을수록 강을 더 가파르게 하는 정도 (G-법칙 계수, Yuan 2019). 히어로(L2)에서 씀
deposition_g_l0 = 0.0                 # 행성 지도(L0, 칸 19.5 km)에서는 퇴적 항을 끔. 켜 본 보정 실험에서는 물길이 반복마다 이쪽저쪽 뒤집혀(진동) 반복 200번 안에 멈추지 않았음 (pipeline.md 7.1)
s_crit_default = 0.6                  # 산비탈이 무너지지 않고 버티는 가장 가파른 경사(임계 경사). 암석 정보가 없을 때만 쓰고 보통은 암석 표 값을 씀. 0.6 은 약 31° [m/m]
s_min = 1.0e-5                        # 가장 완만한 경사 (평탄한 퇴적 분지에서도 물이 흐르게). 1e-5 는 100 km 에 1 m
fill_epsilon_m = 1.0e-3               # 물길을 정할 때만 쓰는 채움 기울기: 메운 웅덩이 바닥에 칸마다 이 높이(1 mm)씩 차이를 둬 물이 흐를 방향을 만듦
hysteresis_eta = 0.02                 # 물길 방향을 바꾸는 문턱. 새 방향이 이만큼(0.02 = 2%) 넘게 더 가파를 때만 바꿈. 키우면 반복마다 물길이 덜 흔들림
jitter = 1.0                          # 칸 중심을 흔들어 두는 세기(노드 흔들기, 칸 크기 대비). 1.0 은 최대 반 칸. 0.4 는 격자 정렬 지수 1.70, 1.0 은 1.12~1.2 (1 이면 강이 격자를 따르지 않음, 합격선 1.3 미만)
max_flow_iterations = 200             # 물길 방향 맞추기 반복 상한 (L0). 멈춤 조건에 못 닿아도 여기서 끝냄. 히어로는 profile.hero.max_flow_iterations
stop_dz_m = 0.1                       # 멈춤 조건: 물길 방향이 하나도 안 바뀌고 높이 변화가 모두 0.1 m 미만. 키우면 일찍 멈춤

[relief]
hack_coefficient_km = 2.02            # 강 길이와 유역 넓이의 관계(Hack 법칙) L = 2.02·A^0.49 의 계수 (km, km²; Montgomery & Dietrich 1992). L0 칸 안의 기복을 어림할 때 씀
hack_exponent = 0.49
mean_fraction = 0.5                   # 평균 지표 = 골짜기 바닥 + 이 비율 × 기복. 키우면 L0 칸의 평균 높이가 올라가고 지각 세기 한계가 일찍 걸림

[fans]
enabled = true
slope_drop_ratio = 4.0                # 하류로 가며 강 경사가 이 배 이상 줄어드는 곳(산지 앞)을 선상지 꼭짓점으로 봄. 키우면 선상지가 줄어듦 (4 는 n = 1 기준, pipeline.md 14장)
min_discharge_m3_per_yr = 1.0e6
max_discharge_m3_per_yr = 1.0e9
radius_m = 3_000.0
slope = 0.03

# ---------------------------------------------------------------- 조각 사슬 (사슬 2): 암석과 지층 (지질)
[geology]
geotherm_c_per_m = 0.030              # 땅속으로 내려갈수록 오르는 온도, 30 °C/km. 묻혔던 깊이의 온도로 변성을 정함. 키우면 얕게 묻힌 암석도 변성암이 됨
surface_temperature_c = 10.0
fold_wavelength_m = 15_000.0          # 습곡(지층이 물결처럼 휜 것)의 파장 (자그로스 10~20 km)
fold_amplitude_m = 1_500.0
fold_belt_width_m = 400_000.0         # 수렴 경계에서 이 거리 안이 습곡충상대(지층이 휘고 밀려 겹친 띠) 후보
arc_belt_width_m = 250_000.0

# ---------------------------------------------------------------- 내부 사슬 (사슬 3): 흙·지하수·동굴, 강의 폭과 깊이
[soil]
production_max_m_per_yr = 3.0e-4      # 흙 생산 최댓값: 흙이 없을 때 암반이 흙으로 바뀌는 속도 (Heimsath). 15 °C·강수 1 m/yr 기준이고, 따뜻하고 습하면 늘어남
production_max_cap_m_per_yr = 2.5e-3  # 흙 생산의 상한, 2.5 mm/yr (남알프스 관측, Larsen 2014, 설계도 5장 14번)
decay_depth_m = 0.5
thickness_cap_m = 3.0
bare_slope = 0.8                      # 이보다 가파르면 흙이 없는 맨 암반 (0.8 은 약 39°). 규암을 뺀 모든 암석의 임계 경사 이상이라 지금은 거의 걸리지 않음 (pipeline.md 14장)
alluvium_max_m = 30.0

[groundwater]
recharge_fraction = 0.5               # 유출 가운데 땅속으로 스며 지하수가 되는 몫(함양). 키우면 지하수면이 높아짐
fan_alpha_m = 120.0                   # 대수층(물이 흐르는 땅속 층) 깊이 f = α / (1 + β·S) 의 α, 평지에서의 깊이 (Fan 2013 e-folding 깊이, 원문 확인 필요). 키우면 지하수면이 낮아짐
fan_beta = 150.0
max_depth_m = 300.0

[caves]
incision_fraction = 0.35              # 위층 동굴 높이 = 지하수면 + 이 비율 × 골짜기 깊이 (하각 비율 f_k, 우리 가정, 설계도 5장). 키우면 위층 동굴이 더 높이 놓임
levels = 2
valley_window_m = 1_500.0             # 골짜기 깊이를 잴 때 강 둘레에서 가장 높은 땅을 찾는 반경. 키우면 골짜기가 깊게 재여 위층 동굴이 높아짐
entrance_tolerance_m = 3.0
passage_radius_m = 3.0
noise_wavelength_m = 60.0

[rivers]
min_discharge_m3_per_s = 0.3          # 1초에 이만큼 이상 흐르는 칸을 강으로 봄. 키우면 큰 강만 남음
width_coefficient = 4.0               # 강 폭 W = k_W · Q^0.5 (Q 단위 m³/s, Leopold–Maddock). 100 m³/s 면 폭 40 m
depth_coefficient = 0.35              # 강 깊이 D = k_D · Q^0.4. 100 m³/s 면 약 2.2 m

# ---------------------------------------------------------------- 굽기: 회랑에만 더하는 보기용 디테일
[detail]                              # 25 m 지도가 그리지 못하는 50 m 보다 짧은 거칠기(프랙탈 디테일)를 회랑 지표(2 m)에 더함. 굽기에서만 쓰는 보기용이고 솔버 결과가 아님
fractal_gain = 2.0                    # 더하는 거칠기의 세기. 0 이면 끔 (detail 파일을 쓰지 않음). 1 = 히어로가 그린 가장 짧은 물결 띠(50~100 m)의 거칠기에서 이어 감. 기본 2 = 두 배 강조 (흙 덮인 회랑에서도 보이게)
hurst = 0.7                           # 물결 길이가 반으로 줄 때 높이 흔들림이 2^-H 배 (0.7 이면 약 0.62배, 0 < H ≤ 1). 작을수록 거침. 프랙탈 차원 D = 3 − H
max_wavelength_m = 50.0               # 이보다 짧은 물결만 더함. 히어로 25 m 지도가 그릴 수 있는 가장 짧은 물결 (칸 2개, 나이퀴스트)
min_wavelength_m = 4.0                # 더하는 가장 짧은 물결 (회랑 2 m 표본 두 칸)
soil_factor = 0.35                    # 흙·충적층이 덮인 곳은 디테일을 이 배로 줄임 (흙 덮인 비탈은 매끈함, Perron 2008)
slope_ref = 0.5                       # 경사가 이 값(약 27°) 이상이면 디테일을 다 더하고, 경사 0 이면 더하지 않음. 그 사이는 경사에 비례
water_margin_m = 6.0                  # 물(water.bin 의 물 표본)에서 이 거리 안은 더하지 않고, 그 밖 20 m 에 걸쳐 다 더하게 늘림
edge_fade_m = 50.0                    # 회랑 가장자리에서 이 거리에 걸쳐 0 → 다 더함 (둘레 25 m 지형과의 단차를 늘리지 않게)
