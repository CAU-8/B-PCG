# 화성 크기 행성 하나의 값입니다. 반지름·밀도·자전·바다 물 양·산 높이 한계만 화성에 맞췄고, 나머지 키는 earth.toml 과 같은 지구 값입니다.
# 단위는 m, kg, s, yr(지구의 1년), °C 이고, 키 이름이 _myr 로 끝나는 값만 Myr(100만 년)입니다.
# 중력은 여기 적지 않고 반지름과 밀도로 계산합니다 (g = 4/3·π·G·ρ·R ≈ 3.73 m/s², 지구의 약 38%).
# 지금 화성에는 움직이는 판도 바다도 비도 없습니다. 이 생성기는 판·액체 물·비 없이 돌지 못하므로, 판과 기후는 지구 값 그대로 두고 물 양만 옛 화성의 바다 추정으로 줄였습니다.
# 암석 표, 지질 틀, 변성 온도, 바다 밑 깊이 식의 계수는 코드에 고정된 지구 값이라 이 파일로 바뀌지 않습니다.

[planet]
name = "mars"
radius_m = 3_389_500.0                # 화성 평균 반지름 3,389.5 km (지구의 약 53%, NASA 화성 자료표)
mean_density_kg_m3 = 3933.0           # 화성 평균 밀도 [kg/m³] (NASA 화성 자료표). 반지름과 함께 중력을 정함. 키우면 중력이 커짐
rotation_period_s = 88_642.4          # 별을 기준으로 한 바퀴 도는 시간(항성일, 약 24시간 37분, NASA 화성 자료표). 지금 생성기는 이 값을 읽지 않음
axis = [0.0, 0.0, 1.0]                # 자전축 방향 (단위 벡터). 위도를 재는 기준이라 비와 기온의 띠가 이 축을 따라 놓임
seed = 0                              # 출발 번호. 같은 시드면 같은 운영체제와 같은 종류의 CPU 에서 바이트까지 같은 행성이 나옴 (운영체제가 다르면 지수·로그 계산의 끝자리가 달라 값이 아주 조금 다를 수 있음)

# ---------------------------------------------------------------- 뼈대 사슬 (사슬 1): 판 → 지각 → 해양저·융기
[plates]
count = 12                            # 판 개수. 키우면 판 하나하나가 작아지고 판 경계가 늘어남
continental_area_fraction = 0.40      # 대륙 지각이 덮는 넓이의 목표 비율 (0.40 = 열 칸 가운데 네 칸; 지구 약 40%, 원문 확인 필요)
warp_amplitude = 0.12                 # 판 경계를 구불구불하게 하는 노이즈 세기 (반지름 1 인 구 위의 길이). 키우면 경계가 더 크게 구불거림
warp_frequency = 2.5                  # 그 노이즈의 기본 주파수 (반지름 1 인 구 기준). 키우면 경계가 더 잘게 구불거림
speed_m_per_yr = [0.02, 0.08]         # 판이 움직이는 속도의 범위 2~8 cm/yr. 판마다 이 안에서 고름. 빨리 마주 올수록 산맥이 빨리 솟음
boundary_kappa = 0.3                  # 판 경계를 가르는 비율 κ (가이드 5장). 마주 오는(멀어지는) 속도가 미끄러지는 속도의 κ배를 넘으면 수렴(발산), 아니면 변환. 키우면 변환 경계가 늘어남

[crust]
continental_thickness_m = 35_000.0
oceanic_thickness_m = 7_000.0
collision_thickening_m = 25_000.0     # 대륙끼리 부딪힌 곳(충돌대)에서 지각에 더하는 두께의 최댓값. 두꺼운 지각은 물에 뜬 두꺼운 얼음처럼 더 높이 뜸(지각평형)
thickening_width_m = 300_000.0        # 그 두께가 퍼지는 폭 (가우스 폭: 충돌 경계에서 이 거리면 더하는 두께가 약 37%)
margin_width_m = 150_000.0            # 대륙 가장자리에서 지각이 얇아지며 바다 밑으로 내려가는 띠(대륙붕·대륙사면)의 폭. 키우면 더 완만하게 내려감
continental_platform_m = 250.0        # 두께 35 km 인 보통 대륙 지각이 뜨는 높이 (해수면 기준 근사). 바다와 육지를 가르는 기준 고도에 쓰고, 산 높이는 솔버가 따로 정함
rho_crust = 2_800.0
rho_mantle = 3_300.0
rho_water = 1_030.0

[ocean]
water_volume_m3 = 2.0e16              # 바다에 채우는 물의 부피. 옛 화성의 물을 표면 전체에 고르게 펴면 깊이 137 m 이상(Villanueva 2015)이라 137 m × 화성 표면 1.44e14 m² ≈ 2.0e16 m³. 키우면 바다가 넓어짐
ridge_depth_m = 2_500.0               # 바다 밑 산맥(해령) 꼭대기의 깊이 (Parsons & Sclater 1977). 해양저는 여기서 생겨 나이가 들수록 식어 깊어짐
age_cap_myr = 200.0                   # 해양저 나이의 상한 (안전장치). 나이는 해령에서 흐름선을 따라 떨어진 거리로 정해져 저절로 잘리게 함 (설계도 5장 17번)
trench_depth_m = 3_000.0              # 해구(바다 판이 파고드는 곳의 깊은 골)에서 바다 밑이 더 깊어지는 양 (띠가 좁아 L0 에서 다시 계산)
trench_width_m = 40_000.0

[uplift]
orogen_factor = 0.03                  # 바다 판이 파고드는 곳(섭입)의 위쪽 판에서 산맥이 솟는 속도 = 계수 × 마주 오는 속도 (5 cm/yr → 1.5 mm/yr). 키우면 산맥이 높아짐
collision_factor = 0.04               # 대륙끼리 부딪힌 곳(충돌대)이 솟는 속도 = 계수 × 마주 오는 속도. 키우면 충돌대가 높아짐
orogen_width_m = 80_000.0             # 섭입 산맥이 솟는 띠의 폭 (가우스 폭, 띠 가운데는 화산호 자리). 150 km 는 띠가 너무 넓어 L0 가 10 km 를 넘음
collision_width_m = 100_000.0         # 충돌대가 솟는 띠의 폭 (가우스 폭: 판 경계에서 이 거리면 융기가 약 37%)
slab_shallow_dip_deg = 15.0           # 파고드는 판(섭입판)의 얕은 구간 기울기 (설계도 5장 16번: 10~20°). 키우면 화산호와 산맥 띠가 해구 쪽으로 다가옴
slab_shallow_depth_m = 40_000.0       # 얕은 구간이 끝나는 깊이 (30~50 km)
slab_deep_dip_deg = 50.0              # 깊은 구간 기울기
arc_slab_depth_m = 100_000.0          # 화산호 아래 섭입판의 깊이. 위 넷이 해구–화산호 거리를 정함 (기본값으로 약 200 km)
craton_erosion_m_per_myr = 5.0        # 산맥 밖 오래된 대륙(크라톤)의 기본 깎임 (2~10 m/Myr). 모든 육지 칸에 이만큼의 융기를 깔아 둠 (5 m/Myr = 100만 년에 5 m)
rift_subsidence_m_per_yr = -1.0e-4    # 대륙이 갈라지는 곳(열곡) 축이 가라앉는 속도 (음수, −0.1 mm/yr). 축에서 50 km 안의 대륙에만
orogen_duration_myr = 30.0            # 산맥이 솟아 온 기간. 깎인 두께 = 융기 × 기간. 키우면 더 깊은 지층이 지표에 드러남
exhumation_cap_m = 30_000.0           # 깎인 두께(누적 융기)의 상한 (25~35 km, 설계도 5장 8번)
elevation_limit_m = 14_500.0          # 지각 세기 한계: 첫 풀이의 평균 지표가 이 높이에 가까운 곳은 융기를 줄여 다시 풂. 암석 세기가 지구와 같으면 버티는 높이는 중력에 반비례하므로 지구 5,500 m × 9.82 / 3.73 ≈ 14,500 m. 키우면 더 높은 고원이 남음
elevation_limit_power = 4.0           # 줄이는 모양 p: U' = U·(1 − (z_mean/z_lim)^p). 키우면 한계 가까이에서만 줄임 (p = 4 면 한계의 절반 높이에서 6%만 줄임)

# ---------------------------------------------------------------- 가벼운 기후: 위도와 높이로 정하는 비·기온·유출
[climate]
p_base_m_per_yr = 0.25                # 어디에나 내리는 기본 강수 p₀. 위도 띠 강수 (가이드 5장): P = (p₀ + p₁·e^… + p₂·e^…)·e^(η ξ − η²/2)
p_equator = 1.8
p_equator_sigma_deg = 12.0
p_midlat = 0.9
p_midlat_center_deg = 50.0
p_midlat_sigma_deg = 12.0
p_noise = 0.35                        # 강수를 곳마다 들쭉날쭉하게 하는 노이즈 세기 η_P. 0 이면 위도로만 정해지고, 키우면 비가 많은 곳과 적은 곳의 차이가 커짐
t_equator_c = 27.0
t_pole_c = -25.0
lapse_rate_c_per_m = 0.0065
pet_per_degc_m_per_yr = 0.055         # 기온 1 °C 마다 늘어나는 잠재 증발산(물이 넉넉할 때 증발할 수 있는 양) a. 잠재 증발산 = a·max(T, 0) + b. 키우면 강으로 가는 물(유출)이 줄어듦
pet_base_m_per_yr = 0.1
runoff_floor_fraction = 0.1           # 침식에 쓰는 유출의 바닥값: 강수의 이 비율 (설계도 5장 1번). 사막에서도 강이 조금은 깎게 함
runoff_floor_m_per_yr = 0.01
runoff_ref_m_per_yr = 0.3             # 기준 유출. G-법칙의 기준으로, 강물 대비 흙의 비율 Qs/Q 를 깎는 속도로 바꿈 (깎임 = U + G·이 값·Qs/Q). 키우면 G 를 키운 것과 같음

# ---------------------------------------------------------------- 조각 사슬 (사슬 2): 강과 비탈이 깎는 산의 모양 (솔버)
[landscape]
theta = 0.45                          # 강이 상류에서 가파르고 바다 쪽으로 갈수록 완만해지는 정도(오목도 θ). 물이 10배 늘면 경사가 약 0.35배 (생성기에서는 고정)
slope_exponent_n = 2.0                # 깎는 속도 ∝ 강 가파름^n. n > 1 이 흔함 (설계도 5장 6번). n = 2 면 융기가 4배일 때 강 가파름은 2배. n = 1 은 L0 가 수십 km
k_ref = 150.0                         # 기준 암석이 U_ref 로 솟을 때의 강 가파름 k_s (Q 단위 m³/yr). 강 경사 = k_s·Q^(−θ). 키우면 강과 산이 같은 비율로 가팔라짐
u_ref_m_per_yr = 1.0e-3               # k_ref 를 정하는 기준 융기 속도 U_ref, 1 mm/yr (1,000년에 1 m)
hillslope_diffusivity_m2_per_yr = 0.005
deposition_g = 1.0                    # 강이 나르는 흙이 많을수록 강을 더 가파르게 하는 정도 (G-법칙 계수, Yuan 2019). 히어로(L2)에서 씀
deposition_g_l0 = 0.0                 # 행성 지도(L0, 칸 19.5 km)에서는 퇴적 항을 끔. 켜 본 보정 실험에서는 물길이 반복마다 이쪽저쪽 뒤집혀(진동) 반복 200번 안에 멈추지 않았음 (pipeline.md 7.1)
s_crit_default = 0.6                  # 산비탈이 무너지지 않고 버티는 가장 가파른 경사(임계 경사). 암석 정보가 없을 때만 쓰고 보통은 암석 표 값을 씀. 0.6 은 약 31° [m/m]
s_min = 1.0e-5                        # 가장 완만한 경사 (평탄한 퇴적 분지에서도 물이 흐르게). 1e-5 는 100 km 에 1 m
fill_epsilon_m = 1.0e-3               # 물길을 정할 때만 쓰는 채움 기울기: 메운 웅덩이 바닥에 칸마다 이 높이(1 mm)씩 차이를 둬 물이 흐를 방향을 만듦
hysteresis_eta = 0.02                 # 물길 방향을 바꾸는 문턱. 새 방향이 이만큼(0.02 = 2%) 넘게 더 가파를 때만 바꿈. 키우면 반복마다 물길이 덜 흔들림
jitter = 1.0                          # 칸 중심을 흔들어 두는 세기(노드 흔들기, 칸 크기 대비). 1.0 은 최대 반 칸. 흔들수록 강이 격자를 덜 따름 (점수표 격자 정렬 지수: 1 이면 따르지 않음, 합격선 1.3 미만)
max_flow_iterations = 400             # 행성 지도(L0) 솔버가 멈춤 조건에 못 닿아도 반복을 끝내는 횟수. 줄이면 덜 풀린 지형으로 끝나는 시드가 생김. earth.toml 과 같은 값이고, 화성 설정으로 몇 번에 멈추는지는 아직 재지 않음. 히어로는 profile.hero.max_flow_iterations
stop_dz_m = 0.1                       # 멈춤 조건: 물길 방향이 하나도 안 바뀌고 높이 변화가 모두 0.1 m 미만. 키우면 일찍 멈춤

[relief]
hack_coefficient_km = 2.02            # 강 길이와 유역 넓이의 관계(Hack 법칙) L = c·A^0.49 의 계수 c (L 은 본류 길이 km, A 는 유역 넓이 km²). L0 칸 안의 기복을 어림할 때 씀. 2.02 는 Montgomery & Dietrich 1992 가 지구의 여러 크기 유역에 맞춘 값 (Sassolas-Serrayet 외 2018 이 옮겨 적은 값). 키우면 칸 안 하천 기복이 같은 비율로 커짐
hack_exponent = 0.49
mean_fraction = 0.5                   # 평균 지표 = 골짜기 바닥 + 이 비율 × 기복. 키우면 L0 칸의 평균 높이가 올라가고 지각 세기 한계가 일찍 걸림

[fans]
enabled = true
slope_drop_ratio = 4.0                # 하류로 가며 강 경사가 이 배 이상 줄어드는 곳(산지 앞)을 선상지 꼭짓점으로 봄. 키우면 선상지가 줄어듦 (4 는 n = 1 기준, pipeline.md 14장)
min_discharge_m3_per_yr = 1.0e6
max_discharge_m3_per_yr = 1.0e9
radius_m = 3_000.0
slope = 0.03

[dams]
enabled = true                        # 산사태 둑: 가파른 산비탈이 무너져 골짜기를 막은 돌무더기. 둑 뒤는 강이 실어 온 흙으로 메워져 평지가 되고, 덜 메워진 둑 뒤에만 호수가 남음. false 면 둑을 놓지 않음 (걷는 유역에만 놓음)
blocking_fraction = 0.02              # 골짜기를 막을 만큼 큰 산사태 가운데 실제로 둑이 되어 남는 몫 (0~1). 둑의 수는 이 값에 비례함. 실제 둑 목록의 밀도(1,000 km² 에 1~10개)에 맞춘 값
persistence_yr = 5_000.0              # 무너지지 않은 둑이 강에 깎여 없어질 때까지 남는 햇수. 키우면 둑과 평지가 늘어남. 큰 암석 사태의 막힘은 천~만 년 남음 (Korup 외 2006)
min_height_m = 10.0                   # 다루는 가장 낮은 둑의 높이 (m). 이보다 낮은 둑은 25 m 칸으로 그리지 못함
max_height_m = 150.0                  # 다루는 가장 높은 둑의 높이 (m). 큰 둑일수록 드묾 (큰 산사태가 드물기 때문)
slope = 0.15                          # 둑 비탈의 경사 (0.15 는 100 m 에 15 m, 약 9°). 줄이면 같은 높이에 돌이 더 많이 들어 둑이 드물어짐. 노르웨이 둑의 가운데값(높이 21 m, 폭 330 m)이 약 0.13
fill_slope_ratio = 0.5                # 둑 뒤를 메운 흙 바닥의 경사 ÷ 메우기 전 강바닥의 경사. 0.5 는 저수지에 쌓인 흙에서 잰 값 (Strand & Pemberton 1982). 키우면 메운 땅이 상류로 더 길게 이어짐 (0 이상 1 미만)
min_slope_ratio = 0.9                 # 옆 비탈이 이 배(무너지는 경사 S_crit 기준) 이상 가파른 물길에만 산사태가 난다고 봄. 줄이면 완만한 골짜기에도 둑이 생김. 0.5~1.0
min_drainage_area_m2 = 1.0e5          # 상류 넓이가 이만큼 이상인 칸을 물길로 봄 (m², 1.0e5 는 0.1 km²). 이보다 작은 도랑에는 둑을 놓지 않음

[lakes]
min_depth_m = 2.0                     # 가장 깊은 곳이 이보다 얕은 웅덩이는 호수로 두지 않고 흙으로 메움 (m). 넘치지 못하는 호수도 가장 깊은 곳의 물 깊이가 이보다 얕으면 마른 분지(소금 평지)로 셈. 키우면 얕은 못과 얕은 소금 호수가 사라짐. 0 이면 깊이로는 메우지 않음
min_area_m2 = 10_000.0                # 넓이가 이보다 작은 웅덩이도 흙으로 메움 (m², 10,000 m² 는 100 × 100 m). 키우면 작은 못이 사라짐. 0 이면 넓이로는 메우지 않음
hollow_depth_m = 300.0                # 빙하기의 얼음이 긁어 만든 우묵한 자리의 가장 깊은 곳 (m). 키우면 더 가파른 땅에도 호수가 생기고 호수가 깊어짐. 0 이면 얼음이 긁은 자리를 만들지 않음
hollow_wavelength_m = 400_000.0       # 얼음이 긁은 우묵한 자리 하나의 대략의 크기 (m). 키우면 호수가 크게 뭉치고, 줄이면 작은 호수가 흩어짐. 행성 지도 칸(약 20 km)의 10배 이상
hollow_fraction = 0.03                # 얼음이 덮인 적이 있는 땅 가운데 긁혀 낮아진 몫 (0~1). 0.03 은 100칸 가운데 3칸. 낮춘 땅 가운데 물이 고이는 곳만 호수가 됨. 키우면 고위도의 호수가 늘어남
hollow_age_yr = 10_000.0              # 얼음이 물러난 뒤 지난 햇수. 그동안 강이 실어 온 흙이 긁힌 자리의 바닥을 메움. 키우면 큰 강 위의 호수부터 사라짐
lgm_cooling_c = 6.0                   # 빙하기 기온이 지금보다 낮았던 정도 (°C). 지구 평균 약 6 °C (Tierney 외 2020). 키우면 얼음이 덮였던 땅이 저위도로 넓어져 호수가 생기는 땅이 넓어짐. 이 키를 지우면 얼음을 따지지 않고 땅 어디에나 우묵한 자리를 둠
summer_amplitude_c = 16.0             # 극에서 여름(가장 따뜻한 석 달)이 연평균보다 따뜻한 정도 (°C). 위도 φ 에서는 이 값 × |sin φ| (가정: 우리 기후에는 계절이 없음). 키우면 여름에 눈이 더 녹아 얼음이 덮인 땅이 줄어듦. 10~20
evaporation = true                    # 호수 수면의 증발을 따짐: 들어오는 물보다 증발이 많은 분지는 넘치지 못하고 강이 거기서 끝남 (소금 호수, 마른 분지). false 면 모든 우묵한 자리를 넘칠 때까지 채움
rift_segment_m = 200_000.0            # 판이 갈라지는 곳에서 가라앉는 분지 하나와 그 옆 턱을 합친 길이 (m). 지구의 열곡 분지는 길이 40~150 km, 흔히 약 100 km. 키우면 열곡 호수가 길어지고, 0 이면 나누지 않아 호수가 판 경계를 따라 끊기지 않고 이어짐

# ---------------------------------------------------------------- 조각 사슬 (사슬 2): 암석과 지층 (지질)
[geology]
geotherm_c_per_m = 0.030              # 땅속으로 내려갈수록 오르는 온도, 30 °C/km. 묻혔던 깊이의 온도로 변성을 정함. 키우면 얕게 묻힌 암석도 변성암이 됨
surface_temperature_c = 10.0
fold_wavelength_m = 15_000.0          # 습곡(지층이 물결처럼 휜 것)의 파장 (자그로스 10~20 km)
fold_amplitude_m = 1_500.0
fold_belt_width_m = 400_000.0         # 수렴 경계에서 이 거리 안이 습곡충상대(지층이 휘고 밀려 겹친 띠) 후보
arc_belt_width_m = 250_000.0

# ---------------------------------------------------------------- 내부 사슬 (사슬 3): 흙·지하수·동굴, 강의 폭과 깊이
[soil]
production_max_m_per_yr = 3.0e-4      # 흙 생산 최댓값 [m/yr]: 흙이 없을 때 암반이 흙으로 바뀌는 속도. 15 °C·강수 1 m/yr 기준이고, 따뜻하고 습하면 늘어남 (북캘리포니아 맨 암반 0.077 mm/yr, Heimsath 외 1997. 여러 곳의 잰 값 0.05~2.0 mm/yr)
production_max_cap_m_per_yr = 2.5e-3  # 흙 생산의 상한, 2.5 mm/yr (남알프스 관측, Larsen 2014, 설계도 5장 14번)
decay_depth_m = 0.5
thickness_cap_m = 3.0
bare_slope_ratio = 0.9                # 경사가 그 암석이 버티는 가장 가파른 경사(임계 경사)의 이 배수 이상이면 흙이 없는 맨 암반. 경사는 그 칸과 둘레 칸의 평균으로 비교. 줄이면 맨 암반이 넓어짐 (0 초과 1 이하. 석회암·화강암은 0.9 × 0.8 = 0.72, 약 36°)
alluvium_max_m = 30.0

[groundwater]
recharge_fraction = 0.5               # 평지에서 유출 가운데 땅속으로 스며 지하수가 되는 몫(함양). 비탈은 경사 등급 계수(Döll & Fiedler 2008, 경사 0.45 이상 0.15배)를 더 곱함. 키우면 지하수면이 높아짐
fan_alpha_m = 120.0                   # 흙 가까운 층의 투수가 깊이에 따라 1/e 로 줄어드는 길이 f = α / (1 + β·S) 의 α, 평지 값 (Fan 2013 보충자료의 1.25 km 보정값). 키우면 지하수면이 낮아짐
fan_beta = 150.0
fan_min_m = 5.0                       # f 의 바닥값 (Fan 2013 보충자료 f > 5 m). 가파른 비탈에서도 흙 가까운 층이 이만큼은 물을 나름. 키우면 비탈의 지하수면이 지표에 덜 닿음
surface_log10_perm_m2 = -12.0         # 흙 가까운 층의 투수율 log10 k [m²]. −12 는 Clapp & Hornberger 1978 표의 양토(log k 약 −12.2)와 사양토(약 −11.5) 사이의 흙이고, 화성 중력(3.73 m/s²)에서는 물이 약 118 m/yr 로 지남 (우리가 고른 값. Fan 2013 은 흙 질감별 투수를 Clapp & Hornberger 1978 식으로 정함). 키우면 지하수면이 지표에 덜 닿음
rock_aquifer_m = 100.0                # 기반암 투수(Gleeson 2011 표: 지표에서 약 100 m 깊이까지의 값)가 깊이에 따라 1/e 로 줄어드는 길이 [m] (줄어드는 꼴과 길이는 우리가 고름). 키우면 깊은 곳으로 물이 잘 빠져 능선 밑 지하수면이 낮아짐 (캐스케이드 산맥 얕은 곳 250 m, Saar & Manga 2004)
drain_area_m2 = 100_000.0             # 상류 면적이 이보다 넓은 물길 칸은 지하수면이 바닥에 닿으면 지하수가 빠지는 곳이 됨 (0.1 km², 물길이 시작하는 크기). 줄이면 습한 땅의 지하수면이 낮아짐
drain_passes = 30                     # 큰 물만으로 지하수면을 푼 뒤, 지하수면이 바닥에 닿은 물길을 더해 다시 푸는 횟수의 상한 (더 닿는 물길이 없으면 일찍 멈춤). 0 이면 큰 물(강·호수·바다)만 씀
aquitard_log10_perm_m2 = -15.0        # 투수율 log10 k 가 이 값 이하인 암석(셰일 −16.5)은 물을 막는 층: 그 위에 얹힌 물이 고이고 빗물이 아래 석회암으로 내려가지 못함. 키우면 막는 층이 늘어남
karst_gradient = 0.002                # 녹는 암석(석회암·대리암) 안 지하수면 기울기 [m/m]: 가까운 큰 물 수면 + 이 값 × 거리. 0 보다 커야 함. 물에 잠긴 동굴 통로의 기울기는 0.001 을 거의 넘지 않음(Audra & Palmer 2011). 키우면 강에서 멀수록 동굴 아래층이 높아짐
max_depth_m = 300.0                   # 동굴을 두고 회랑 단면 부피를 굽는 가장 깊은 곳 (지표 아래 m). 지하수면은 이보다 깊어도 자르지 않고, 단면에서만 안 보임

[caves]
incision_fraction = 0.35              # 위층 동굴 높이 = 가까운 큰 물(바다·호수·강, pipeline.md 8.3) 수면 + 이 비율 × 골짜기 깊이 (옛 강 높이, 하각 비율 f_k, 우리 가정, 설계도 5장). 키우면 위층 동굴이 더 높이 놓임
levels = 2
valley_window_m = 1_500.0             # 골짜기 깊이를 잴 때 강 둘레에서 가장 높은 땅을 찾는 반경. 키우면 골짜기가 깊게 재여 위층 동굴이 높아짐
entrance_tolerance_m = 3.0
entrance_spacing_m = 200.0            # 같은 층 동굴 입구 사이의 최소 거리 [m]. 줄이면 입구가 늘어남 (슬로베니아 동굴 대장은 석회암 땅 1 km² 에 약 2개)
passage_radius_m = 3.0                # 그리는 동굴 통로(둥근 관) 반지름의 위 한계 [m]. 굵기는 지나는 물의 양과 통로가 물에 잠겨 있던 햇수로 정하고(아래 두 키), 2 m(메시 칸 크기)와 이 값 사이로 자름. 키우면 물이 많은 통로가 더 굵게 그려짐
wall_retreat_m_per_yr = 1.0e-4        # 물이 가득 찬 통로의 벽이 한 해에 녹아 물러나는 거리 [m/yr]. 0.1 mm/yr 는 위 한계 범위(0.1~1 mm/yr, Palmer 1991)의 아래쪽. 키우면 통로가 빨리 굵어져 더 큰 개울까지 땅속으로 사라짐. 0 이면 굽기에서 통로 굵기를 시간으로 막지 않고, 히어로 유역의 개울이 땅속으로 사라지는 계산을 끔 (pipeline.md 8.5)
active_zone_m = 10.0                  # 통로가 물에 잠겨 자라는 높이 범위 [m] (큰비에 물이 오르내리는 폭, 가정). 강이 이 높이를 파 내려가는 동안만 통로가 굵어짐. 키우면 통로가 굵어짐. 수 m ~ 수십 m. 0 이면 통로 굵기를 시간으로 막지 않고, 개울이 땅속으로 사라지는 계산을 끔
noise_wavelength_m = 200.0            # 암석에서 물이 잘 통하는 자리와 덜 통하는 자리가 번갈아 놓이는 간격 [m]. 키우면 통로가 크게 굽이침 (근거 논문 없이 정한 값)
sink_spacing_m = 300.0                # 싱크홀(빗물이 땅속으로 들어가는 구멍) 사이의 최소 거리 [m]. 줄이면 싱크홀과 동굴 통로가 늘어남 (근거 논문 없이 정한 값)
sink_min_area_m2 = 2.0e4              # 빗물이 이 넓이 이상 모이는 자리에만 싱크홀을 둠 [m²]. 2만 m² 는 25 m 칸 32개. 키우면 큰 골짜기에만 생김
full_size_area_m2 = 1.0e6             # 싱크홀로 모인 빗물 넓이가 이만큼일 때 둘레의 꺼진 땅이 가장 큼 [m²]. 1.0e6 은 1 km². 키우면 꺼진 땅이 작아짐
doline_radius_m = 60.0                # 싱크홀 둘레를 그릇 모양으로 꺼뜨릴 때 가장 큰 그릇의 반지름 [m]. 빗물이 적게 모이는 싱크홀은 이보다 작고 15 m 까지 줄어듦. 0 이면 꺼뜨리지 않음 (헝가리 아그텔레크의 꺼진 땅 1,136개는 긴 지름 가운데값 81 m, Telbisz 외 2016)
doline_depth_ratio = 0.10             # 꺼진 땅의 깊이 ÷ 지름. 0.10 이면 지름 80 m 인 그릇의 깊이가 8 m. 키우면 그릇이 깊고 가팔라짐. 아그텔레크에서 잰 평균 0.10, 표준편차 0.04 (Telbisz 외 2016)
doline_max_slope = 0.21               # 둘레 땅의 평균 경사가 이보다 가파르면 그릇 모양으로 꺼뜨리지 않고 구멍만 둠 [m/m]. 0.21 은 약 12° (이보다 가파른 땅에는 꺼진 땅이 거의 없음, Telbisz 외 2024). 키우면 가파른 비탈에도 그릇이 생김

[rivers]
min_discharge_m3_per_s = 0.3          # 1초에 이만큼 이상 흐르는 칸을 강으로 봄. 키우면 큰 강만 남음
width_coefficient = 4.0               # 강 폭 W = k_W · Q^0.5 (Q 단위 m³/s, Leopold–Maddock). 100 m³/s 면 폭 40 m
depth_coefficient = 0.35              # 강 깊이 D = k_D · Q^0.4. 100 m³/s 면 약 2.2 m

[hero]
site_lat_lon_deg = []                 # 히어로 유역을 둘 자리 [위도, 경도] (°, 예: [16.0, 15.4]). 비워 두면 점수가 가장 높은 칸을 자동으로 고름. 그 자리가 바다, 위도 55° 밖, 해안 가까이면 가장 가까운 후보를 알려 주고 멈춤

# ---------------------------------------------------------------- 굽기: 회랑에만 더하는 보기용 디테일
[detail]                              # 25 m 지도가 그리지 못하는 50 m 보다 짧은 거칠기(프랙탈 디테일)를 회랑 지표(2 m)에 더함. 굽기에서만 쓰는 보기용이고 솔버 결과가 아님
fractal_gain = 2.0                    # 더하는 거칠기의 세기. 0 이면 끔 (detail 파일을 쓰지 않음). 1 = 히어로가 그린 가장 짧은 물결 띠(50~100 m)의 거칠기에서 이어 감. 기본 2 = 두 배 강조 (흙 덮인 회랑에서도 보이게)
hurst = 0.7                           # 물결 길이가 반으로 줄 때 높이 흔들림이 2^-H 배 (0.7 이면 약 0.62배, 0 < H ≤ 1). 작을수록 거침. 프랙탈 차원 D = 3 − H
max_wavelength_m = 50.0               # 이보다 짧은 물결만 더함. 히어로 25 m 지도가 그릴 수 있는 가장 짧은 물결 (칸 2개, 나이퀴스트)
min_wavelength_m = 4.0                # 더하는 가장 짧은 물결 (회랑 2 m 표본 두 칸)
soil_factor = 0.35                    # 흙·충적층이 덮인 곳은 디테일을 이 배로 줄임 (흙 덮인 비탈은 매끈함, Perron 2008)
slope_ref = 0.5                       # 경사가 이 값(약 27°) 이상이면 디테일을 다 더하고, 경사 0 이면 더하지 않음. 그 사이는 경사에 비례
water_margin_m = 6.0                  # 물(water.bin 의 물 표본)에서 이 거리 안은 더하지 않고, 그 밖 20 m 에 걸쳐 다 더하게 늘림
edge_fade_m = 50.0                    # 회랑 가장자리에서 이 거리에 걸쳐 0 → 다 더함 (둘레 25 m 지형과의 단차를 늘리지 않게)
hillslope_smooth_passes = 2           # 산비탈 칸의 높이를 둘레 칸과 섞는 횟수. 칸 크기(25 m)의 울퉁불퉁함을 줄임. 키우면 산비탈이 매끈해지고 능선이 조금 낮아짐. 0 이면 끔 (0~4)
